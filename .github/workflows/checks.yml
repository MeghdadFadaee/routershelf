name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: make test
      - run: make build-mipsle build-smb-mipsle
      - run: go test -race ./cmd/routershelf-smb ./internal/smbwire
